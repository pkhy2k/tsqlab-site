# Pages CMS 설정 (https://pagescms.org) — 웹 화면에서 게시물을 쓰고 고칠 때 사용
# 첫 연결 시 화면에 항목이 의도대로 표시되는지 확인할 것
media:
  input: static/images
  output: /images
content:
  - name: posts
    label: 게시물
    type: collection
    path: content/posts
    filename: "{fields.slug}.md"
    view:
      fields: [title, category, date]
      sort: [date]
    fields:
      - { name: slug, label: "주소(영문 소문자·하이픈)", type: string, required: true }
      - { name: title, label: 제목, type: string, required: true }
      - { name: subtitle, label: 부제, type: string }
      - name: category
        label: 분류
        type: select
        required: true
        options:
          values:
            - { value: service-quality, label: 서비스품질 }
            - { value: hotel-it-qa, label: "호텔 IT·QA" }
            - { value: tourism-policy, label: "관광정책·트렌드" }
            - { value: column, label: 칼럼 }
            - { value: report, label: 리포트 }
      - name: author
        label: 필자
        type: select
        required: true
        options:
          values:
            - { value: director, label: 소장 }
            - { value: research, label: 편집부 }
      - { name: date, label: 게시일, type: date, required: true, options: { format: "yyyy-MM-dd" } }
      - { name: updated, label: 수정일, type: date, options: { format: "yyyy-MM-dd" } }
      - { name: summary, label: "요약(80~150자)", type: string }
      - { name: thumbnail, label: 대표 이미지, type: image }
      - { name: thumbnail_alt, label: 이미지 대체 텍스트, type: string }
      - { name: thumbnail_caption, label: 사진 설명, type: string }
      - { name: tags, label: 태그, type: string, list: true }
      - { name: featured, label: 메인 헤드라인, type: boolean }
      - { name: pick, label: 추천 글, type: boolean }
      - { name: source, label: 원 게재 매체, type: string }
      - { name: draft, label: 비공개(초안), type: boolean }
      - { name: references, label: 참고문헌, type: string, list: true }
      - { name: body, label: 본문, type: rich-text, options: { format: markdown } }
